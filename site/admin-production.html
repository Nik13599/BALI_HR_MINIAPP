<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090806">
  <title>BALI Admin — Production Control</title>
  <link rel="stylesheet" href="/site/admin-production.css?v=bali-production-2">
  <link rel="stylesheet" href="/site/admin-mobile-access.css?v=20260816-1">
  <script defer src="/site/admin-production.js?v=bali-production-2"></script>
</head>
<body>
  <section class="admin-login" id="adminLogin">
    <form id="adminLoginForm">
      <span class="admin-logo">B</span>
      <p class="eyebrow">BALI CONTROL CENTER</p>
      <h1>Служебный вход</h1>
      <p>Пользовательская мобильная сессия не предоставляет доступ к этой панели.</p>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
      <button type="submit">Войти в админку</button>
      <small id="adminLoginError"></small>
    </form>
  </section>

  <div class="admin-app" id="adminApp" hidden>
    <header class="admin-header">
      <div class="admin-brand"><span>B</span><div><b>BALI CONTROL</b><small>CRM · EVENTS · ECONOMY · SECURITY</small></div></div>
      <nav>
        <button type="button" data-admin-view="dashboard">Дашборд</button>
        <button type="button" data-admin-view="crm">CRM</button>
        <button class="mobile-access-nav" type="button" data-mobile-access-view="1">Доступ <span class="mobile-access-badge" id="mobileAccessBadge" hidden>0</span></button>
        <button type="button" data-admin-view="events">События</button>
        <button type="button" data-admin-view="bookings">Брони</button>
        <button type="button" data-admin-view="operations">QR</button>
        <button type="button" data-admin-view="layouts">Схемы</button>
        <button type="button" data-admin-view="economy">Экономика</button>
        <button type="button" data-admin-view="content">Дизайн</button>
        <button type="button" data-admin-view="campaigns">Рассылки</button>
        <button type="button" data-admin-view="moderation">Модерация</button>
        <button class="active" type="button" data-admin-view="chats">Чаты</button>
        <button type="button" data-admin-view="audit">Аудит</button>
        <button type="button" data-admin-view="limits">Лимиты</button>
      </nav>
      <div class="admin-account"><span id="adminEmail"></span><button id="adminLogout" type="button">Выйти</button></div>
    </header>

    <main class="admin-layout">
      <aside class="chat-sidebar" id="chatSidebar">
        <header><h2>Кланы</h2><button class="small-button" id="createClanButton" type="button">Создать клан</button><input id="chatSearch" type="search" placeholder="Поиск клана"></header>
        <div id="chatList"></div>
      </aside>
      <section class="admin-content" id="adminContent">
        <div class="admin-empty">Выберите клановый чат.</div>
      </section>
    </main>
  </div>
  <dialog id="adminDialog"><form method="dialog" id="adminDialogForm"><header><h2 id="adminDialogTitle">Действие</h2><button value="cancel">×</button></header><div id="adminDialogBody"></div></form></dialog>
  <div class="admin-toast" id="adminToast"></div>
  <script defer src="/site/admin-platform-ui.js?v=bali-production-2"></script>
  <script defer src="/site/admin-mobile-access.js?v=20260816-1"></script>
</body>
</html>
