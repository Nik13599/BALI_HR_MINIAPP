name: Build BALI deployment bundles

on:
  push:
    branches:
      - agent/vercel-bundle-build
    paths:
      - .github/workflows/build-vercel-bundle.yml
      - api/**
      - edge/**
      - server/**
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vercel-bundle-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build self-contained Vercel handler
        run: >-
          npx --yes esbuild@0.25.9 api/index.ts
          --bundle
          --platform=node
          --format=cjs
          --target=node22
          --minify
          --outfile=vercel-bundle/index.cjs
      - name: Build Supabase Edge server with native npm dependencies
        run: >-
          npx --yes esbuild@0.25.9 edge/bali-api-entry.ts
          --bundle
          --platform=node
          --format=esm
          --target=es2022
          --packages=external
          --minify
          --outfile=vercel-bundle/bali-edge.mjs
      - name: Validate generated modules
        run: |
          node --check vercel-bundle/index.cjs
          node --check vercel-bundle/bali-edge.mjs
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-bundle/index.cjs vercel-bundle/bali-edge.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Build BALI deployment bundles [skip ci]"
            git push origin HEAD:agent/vercel-bundle-build
          fi
