name: Build temporary BALI Edge bundle

on:
  push:
    branches:
      - agent/supabase-edge-mobile-api
    paths:
      - .github/workflows/build-edge-temp.yml
      - edge/**
      - server/**
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-edge-mobile-api
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build Edge bundle
        run: >-
          npx --yes esbuild@0.25.9 edge/bali-api-entry.ts
          --bundle
          --platform=node
          --format=esm
          --target=es2022
          --packages=external
          --minify
          --outfile=edge-dist/bali-edge.mjs
      - run: node --check edge-dist/bali-edge.mjs
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge-dist/bali-edge.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Build temporary BALI Edge bundle [skip ci]"
            git push origin HEAD:agent/supabase-edge-mobile-api
          fi
