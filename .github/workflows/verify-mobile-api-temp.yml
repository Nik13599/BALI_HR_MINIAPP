name: Verify temporary BALI admin API

on:
  push:
    branches:
      - agent/supabase-edge-mobile-api
    paths:
      - .github/workflows/verify-mobile-api-temp.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify web admin CORS preflight
        run: |
          set -euo pipefail
          BASE='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-api'
          curl -fsS -D /tmp/headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://nik13599.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$BASE/api/v1/auth/admin/login"
          grep -qi '^access-control-allow-origin: https://nik13599.github.io' /tmp/headers
          grep -qi 'access-control-allow-headers:.*Authorization' /tmp/headers
      - name: Verify admin login bearer session and protected endpoint
        run: |
          set -euo pipefail
          BASE='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-api'
          SETUP=$(curl -fsS 'https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-diag')
          EMAIL=$(printf '%s' "$SETUP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["email"])')
          PASSWORD=$(printf '%s' "$SETUP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"email":sys.argv[1],"password":sys.argv[2]}))' "$EMAIL" "$PASSWORD")
          LOGIN=$(curl -fsS \
            -H 'Origin: https://nik13599.github.io' \
            -H 'content-type: application/json' \
            --data-binary "$BODY" \
            "$BASE/api/v1/auth/admin/login")
          TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          test -n "$TOKEN"
          SESSION=$(curl -fsS \
            -H 'Origin: https://nik13599.github.io' \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/auth/admin/session")
          printf '%s' "$SESSION" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["admin"]["email"]=="probe-admin@bali.invalid"; assert x["admin"]["role"]=="superadmin"'
          PERMISSIONS=$(curl -fsS \
            -H 'Origin: https://nik13599.github.io' \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/admin/permissions")
          printf '%s' "$PERMISSIONS" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert isinstance(x.get("permissions"), list)'
