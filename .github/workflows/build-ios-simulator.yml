name: Build iOS simulator app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "site/**"
      - ".github/workflows/build-ios-simulator.yml"

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native dependencies
        working-directory: native
        run: npm install
      - name: Bundle BALI web client
        working-directory: native
        run: npm run web:prepare
      - name: Generate iOS project
        working-directory: native
        run: npx cap add ios
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync ios
      - name: Build unsigned simulator app
        working-directory: native
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        working-directory: native
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app BALI-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-iOS-Simulator
          path: native/build/Build/Products/Debug-iphonesimulator/BALI-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
