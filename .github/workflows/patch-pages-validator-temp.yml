name: Patch Pages validator temporarily

on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/patch-pages-validator-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add Node-only Match3 engine bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/match3-game-core-beta4.js')
          text = p.read_text()
          marker = '(() => {\n  "use strict";'
          bootstrap = 'if (typeof window !== "undefined" && !window.BaliMatch3InfiniteEngine && typeof require === "function") {\n  try { require("./match3-infinite-engine-beta4.js"); } catch {}\n}\n\n(() => {\n  "use strict";'
          if bootstrap not in text:
              if marker not in text:
                  raise SystemExit('Match3 core marker not found')
              p.write_text(text.replace(marker, bootstrap, 1))
          PY
      - name: Commit Match3 validator bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/match3-game-core-beta4.js
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap Match3 engine for Node validator [skip ci]"
            git push origin HEAD:gh-pages
          fi
