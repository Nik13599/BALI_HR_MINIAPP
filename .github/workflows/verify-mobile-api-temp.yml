name: Verify temporary BALI mobile API

on:
  push:
    branches:
      - agent/supabase-edge-mobile-api
    paths:
      - .github/workflows/verify-mobile-api-temp.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Capacitor CORS preflight
        run: |
          set -euo pipefail
          BASE='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-api'
          curl -fsS -D /tmp/headers -o /dev/null -X OPTIONS \
            -H 'Origin: capacitor://localhost' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$BASE/api/v1/auth/mobile/login"
          grep -qi '^access-control-allow-origin: capacitor://localhost' /tmp/headers
          grep -qi 'access-control-allow-headers:.*Authorization' /tmp/headers
      - name: Verify password login and bearer authenticated session
        run: |
          set -euo pipefail
          BASE='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-api'
          SETUP=$(curl -fsS 'https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-diag')
          PASSWORD=$(printf '%s' "$SETUP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')
          LOGIN=$(curl -fsS \
            -H 'Origin: capacitor://localhost' \
            -H 'content-type: application/json' \
            --data-binary "$(python3 -c 'import json,sys; print(json.dumps({"phone":"+375290000003","password":sys.argv[1]}))' "$PASSWORD")" \
            "$BASE/api/v1/auth/mobile/login")
          TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          test -n "$TOKEN"
          SESSION=$(curl -fsS \
            -H 'Origin: capacitor://localhost' \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/auth/mobile/session")
          printf '%s' "$SESSION" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["authMethod"]=="mobile"; assert x["user"]["id"]=="probe:mobile:bearer-20260816"'
      - name: Verify standalone registration write path
        run: |
          set -euo pipefail
          BASE='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-api'
          curl -fsS \
            -H 'Origin: capacitor://localhost' \
            -H 'content-type: application/json' \
            -d '{"phone":"+375290000004","telegramUsername":"bali_mobile_cors_probe","displayName":"BALI Mobile CORS Probe"}' \
            "$BASE/api/v1/auth/mobile/register-request" >/dev/null
