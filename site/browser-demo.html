<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BALI — Browser Demo</title>
  <script>
    try { delete window.Telegram; } catch { window.Telegram = undefined; }
    try {
      Object.keys(localStorage).filter(key => /telegram|tg_auth|initdata/i.test(key)).forEach(key => localStorage.removeItem(key));
      Object.keys(sessionStorage).filter(key => /telegram|tg_auth|initdata/i.test(key)).forEach(key => sessionStorage.removeItem(key));
    } catch {}
    window.BALI_BROWSER_DEMO = true;
    window.BALI_DEMO_ONLY = true;
  </script>
</head>
<body data-bali-mode="browser-demo">
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <div style="position:fixed;right:8px;bottom:82px;z-index:99999;padding:4px 7px;border-radius:999px;background:rgba(8,10,10,.86);border:1px solid rgba(200,255,61,.45);color:#c8ff3d;font:800 9px/1 system-ui;letter-spacing:.08em;pointer-events:none">BROWSER DEMO</div>
  <script src="./config.js?v=bali-browser-demo-1"></script>
  <script src="./demo-seed.js?v=bali-browser-demo-1"></script>
  <script src="./demo-live-sync.js?v=bali-browser-demo-1"></script>
  <script src="./beta4-square-loader.js?v=bali-browser-demo-1"></script>
  <script src="./demo-user-toolbar.js?v=bali-browser-demo-1"></script>
</body>
</html>
