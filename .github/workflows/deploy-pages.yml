name: Deploy BALI Full Browser Demo

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - "site/**"
      - "index.html"
      - "404.html"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build full Beta4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Validate full browser DEMO
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            404.html
            site/index.html
            site/admin.html
            site/admin-beta4.html
            site/browser-demo.html
            site/browser-admin.html
            site/demo-seed.js
            site/bali-browser-demo-data.js
            site/store.js
            site/beta4-square-loader.js
            site/beta4-app.js
            site/beta4-qr-checkin.js
            site/event-qr-attendance-beta4.js
            site/night-crown-beta4.js
            site/beta4-social-page.js
            site/beta4-profile-v2.js
            site/full-demo-runtime-fixes-beta4.js
            site/full-demo-nav-unlock-beta4.js
            site/full-demo-social-economy-beta4.js
            site/full-demo-people-upgrade-beta4.js
            site/full-demo-people-finalizer-beta4.js
            site/full-demo-event-presence-beta4.js
            site/full-demo-review-window-beta4.js
            site/auto-event-qr-beta4.js
            site/admin-event-time-fields-beta4.js
            site/admin-event-qr-auto-beta4.js
            site/admin-full-users-beta4.js
            site/full-demo-fixes-beta4.css
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          scripts=(
            site/beta4-square-loader.js
            site/full-demo-runtime-fixes-beta4.js
            site/full-demo-nav-unlock-beta4.js
            site/full-demo-social-economy-beta4.js
            site/full-demo-people-upgrade-beta4.js
            site/full-demo-people-finalizer-beta4.js
            site/full-demo-event-presence-beta4.js
            site/full-demo-review-window-beta4.js
            site/auto-event-qr-beta4.js
            site/admin-event-time-fields-beta4.js
            site/admin-event-qr-auto-beta4.js
            site/admin-full-users-beta4.js
            site/bali-people-privacy-beta4.js
          )
          for file in "${scripts[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

          grep -q 'beta4-square-loader.js?v=bali-full-demo-5' site/index.html
          grep -q 'full-demo-runtime-fixes-beta4.js' site/beta4-square-loader.js
          grep -q 'full-demo-nav-unlock-beta4.js' site/beta4-square-loader.js
          grep -q 'full-demo-people-finalizer-beta4.js' site/beta4-square-loader.js
          grep -q 'event-qr-attendance-beta4.js' site/beta4-square-loader.js
          grep -q 'night-crown-beta4.js' site/beta4-square-loader.js
          grep -q 'full-demo-people-upgrade-beta4.js' site/beta4-square-loader.js
          grep -q 'admin-event-time-fields-beta4.js' site/admin-beta4.html
          grep -q 'admin-event-qr-auto-beta4.js' site/admin-beta4.html
          grep -q 'admin-full-users-beta4.js' site/admin-beta4.html

          if grep -Eqi 'telegram-web-app\.js|telegram\.org/js|supabase-js|cdn\.jsdelivr\.net/npm/@supabase' site/index.html site/admin-beta4.html; then
            echo "Telegram or Supabase SDK found in full browser DEMO entry point"
            exit 1
          fi

      - name: Prepare clean static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R site _site/site
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/site/index.html
          test -f _site/site/beta4-square-loader.js
          test -f _site/site/full-demo-nav-unlock-beta4.js
          test -f _site/site/full-demo-people-upgrade-beta4.js
          test -f _site/site/full-demo-people-finalizer-beta4.js
          test -f _site/site/admin-event-qr-auto-beta4.js
          test -f _site/site/admin.html

          if find _site -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in a GitHub Pages artifact"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000