name: Patch mobile auth fixture temporarily

on:
  push:
    branches: [agent/supabase-edge-mobile-api]
    paths:
      - ".github/workflows/patch-mobile-fixture-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-edge-mobile-api
      - name: Add migration 018 mobile_credentials fixture
        run: >-
          python3 -c 'from pathlib import Path; p=Path("tests/server/helpers.ts"); t=p.read_text(); m="create table public.clans ("; b="create table public.mobile_credentials (\n  app_user_key text primary key references public.app_users(user_key) on delete cascade,\n  phone text not null unique,\n  telegram_username text not null,\n  password_hash text not null,\n  must_change_password boolean not null default true,\n  password_issued_at timestamptz not null default now(),\n  password_changed_at timestamptz,\n  last_login_at timestamptz,\n  failed_login_count integer not null default 0,\n  locked_until timestamptz,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n"; assert ("create table public.mobile_credentials (" in t) or (m in t); p.write_text(t if "create table public.mobile_credentials (" in t else t.replace(m,b+m,1))'
      - name: Commit fixture sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/server/helpers.ts
          if ! git diff --cached --quiet; then
            git commit -m "Add mobile credential table to auth fixture"
            git push origin HEAD:agent/supabase-edge-mobile-api
          fi
