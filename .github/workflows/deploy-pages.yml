name: Deploy BALI Browser Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "index.html"
      - "404.html"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate browser DEMO
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            404.html
            site/index.html
            site/admin.html
            site/browser-demo.html
            site/browser-admin.html
            site/beta4-square-loader.js
            site/bali-browser-demo-data.js
            site/store.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          if grep -Eqi 'telegram-web-app\.js|telegram\.org/js|supabase-js|cdn\.jsdelivr\.net/npm/@supabase' site/index.html site/browser-demo.html; then
            echo "External Telegram or Supabase SDK found in browser DEMO entry point"
            exit 1
          fi

      - name: Prepare clean static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R site _site/site
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/site/index.html
          test -f _site/site/browser-demo.html
          test -f _site/site/admin.html

          if find _site -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in a GitHub Pages artifact"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000
