name: Patch iOS permanent password flow
on:
  push:
    branches: [agent/supabase-edge-mobile-api]
    paths:
      - ".github/workflows/patch-mobile-password-change-temp.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-edge-mobile-api
      - name: Patch permanent password form
        shell: python
        run: |
          from pathlib import Path
          p = Path('site/mobile-auth.js')
          s = p.read_text(encoding='utf-8')

          marker = '    return String(value ?? "").normalize("NFKC").trim();\n  }\n\n  function normalizePhoneInput'
          replacement = '''    return String(value ?? "").normalize("NFKC").trim();
          }

          function passwordFieldValue(form, name) {
            const field = form?.elements?.namedItem?.(name);
            const value = field && typeof field.value !== "undefined" ? field.value : "";
            return String(value ?? "");
          }

          function normalizePhoneInput'''
          if 'function passwordFieldValue' not in s:
              if marker not in s:
                  raise SystemExit('password helper insertion point not found')
              s = s.replace(marker, replacement, 1)

          s = s.replace('minlength="12" required></label>\n        <label>Повторите новый пароль', 'minlength="12" maxlength="128" required></label>\n        <label>Повторите новый пароль', 1)
          s = s.replace('name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required', 'name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required', 1)

          old = '''      const data = Object.fromEntries(new FormData(form).entries());
                if (data.newPassword !== data.confirmPassword) {
          '''
          new = '''      const currentPassword = temporaryPassword || passwordFieldValue(form, "currentPassword");
                const newPassword = passwordFieldValue(form, "newPassword");
                const confirmPassword = passwordFieldValue(form, "confirmPassword");
                if (newPassword.length < 12 || newPassword.length > 128) {
                  busy(form, false); showError(new Error("Пароль должен содержать от 12 до 128 символов")); return;
                }
                if (newPassword !== confirmPassword) {
          '''
          if 'Object.fromEntries(new FormData(form).entries())' in s:
              if old not in s:
                  raise SystemExit('change-password FormData block not found')
              s = s.replace(old, new, 1)

          s = s.replace('body:JSON.stringify({ currentPassword: temporaryPassword || data.currentPassword, newPassword:data.newPassword })', 'body:JSON.stringify({ currentPassword, newPassword })', 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate patch
        run: |
          node --check site/mobile-auth.js
          grep -q 'function passwordFieldValue' site/mobile-auth.js
          grep -q 'maxlength="128"' site/mobile-auth.js
          grep -q 'JSON.stringify({ currentPassword, newPassword })' site/mobile-auth.js
          ! grep -q 'Object.fromEntries(new FormData(form).entries())' site/mobile-auth.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/mobile-auth.js
          git commit -m "Fix permanent password form on iPhone"
          git push origin HEAD:agent/supabase-edge-mobile-api
