name: Patch BETA4 clan production API
on:
  push:
    branches: [agent/supabase-edge-mobile-api]
    paths:
      - ".github/workflows/patch-beta4-clan-production-temp.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-edge-mobile-api
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Route BETA4 clan admin to production API
        shell: python
        run: |
          from pathlib import Path
          p = Path('source/site/admin-beta4-production-sync.js')
          s = p.read_text()
          marker = '''  function installGameBridge() {\n'''
          addition = '''  function installClanProductionApi() {\n    if (!window.BaliClans) return;\n    window.BaliClans.api = (path, options = {}) => api(path, options);\n    window.BaliBetaApi = window.BaliClans.api;\n  }\n\n'''
          if 'function installClanProductionApi()' not in s:
              if marker not in s: raise SystemExit('game bridge marker missing')
              s = s.replace(marker, addition + marker, 1)
          old = '''      installStorageMirror();\n      installGameBridge();\n      setAuthStatus("Настройки синхронизированы ✓");'''
          new = '''      installStorageMirror();\n      installClanProductionApi();\n      installGameBridge();\n      setAuthStatus("Настройки синхронизированы ✓");'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '''      installStorageMirror();\n      installGameBridge();\n    }'''
          new2 = '''      installStorageMirror();\n      installClanProductionApi();\n      installGameBridge();\n    }'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          if s.count('installClanProductionApi();') < 2:
              raise SystemExit('clan bridge was not wired into both paths')
          p.write_text(s)
          Path('pages/site/admin-beta4-production-sync.js').write_text(s)
      - name: Validate bridge
        run: |
          node --check source/site/admin-beta4-production-sync.js
          grep -q 'window.BaliClans.api = (path, options = {}) => api(path, options)' source/site/admin-beta4-production-sync.js
      - name: Commit source
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/admin-beta4-production-sync.js
          git commit -m "Use production API for BETA4 clan admin"
          git push origin HEAD:agent/supabase-edge-mobile-api
      - name: Commit Pages
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/admin-beta4-production-sync.js
          if ! git diff --cached --quiet; then
            git commit -m "Use production API for BETA4 clan admin"
            git push origin gh-pages
          fi
