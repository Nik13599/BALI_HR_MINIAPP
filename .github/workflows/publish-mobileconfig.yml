name: Publish BALI MobileConfig web app

on:
  push:
    branches:
      - main
      - agent/supabase-edge-mobile-api
    paths:
      - "native/**"
      - "site/**"
      - ".github/workflows/publish-mobileconfig.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/native/package.json

      - name: Build standalone mobile web bundle
        working-directory: source/native
        run: |
          npm install
          npm run web:prepare

      - name: Checkout GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish isolated mobile bundle
        run: |
          rm -rf pages/mobile
          mkdir -p pages/mobile
          cp -R source/native/www/. pages/mobile/

      - name: Build BALI Web Clip icon and MobileConfig
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import base64, uuid

          source = Path('source/site/assets/bali-temple/gold-bear.webp')
          icon = Image.open(source).convert('RGB')
          icon = ImageOps.fit(icon, (180, 180), method=Image.Resampling.LANCZOS)
          icon_path = Path('pages/mobile/BALI-WebClip.png')
          icon.save(icon_path, format='PNG', optimize=True)
          icon_b64 = base64.b64encode(icon_path.read_bytes()).decode('ascii')

          profile_uuid = str(uuid.uuid4()).upper()
          clip_uuid = str(uuid.uuid4()).upper()
          url = 'https://nik13599.github.io/BALI_HR_MINIAPP/mobile/'
          mobileconfig = f'''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>PayloadContent</key>
            <array>
              <dict>
                <key>FullScreen</key><true/>
                <key>IgnoreManifestScope</key><true/>
                <key>IsRemovable</key><true/>
                <key>Label</key><string>BALI</string>
                <key>Precomposed</key><true/>
                <key>URL</key><string>{url}</string>
                <key>Icon</key><data>{icon_b64}</data>
                <key>PayloadDisplayName</key><string>BALI</string>
                <key>PayloadDescription</key><string>BALI Mobile full-screen web application</string>
                <key>PayloadIdentifier</key><string>club.bali.mobile.webclip</string>
                <key>PayloadType</key><string>com.apple.webClip.managed</string>
                <key>PayloadUUID</key><string>{clip_uuid}</string>
                <key>PayloadVersion</key><integer>1</integer>
              </dict>
            </array>
            <key>PayloadDisplayName</key><string>BALI Mobile</string>
            <key>PayloadDescription</key><string>Устанавливает BALI на главный экран iPhone в полноэкранном режиме.</string>
            <key>PayloadOrganization</key><string>BALI</string>
            <key>PayloadIdentifier</key><string>club.bali.mobile.profile</string>
            <key>PayloadRemovalDisallowed</key><false/>
            <key>PayloadType</key><string>Configuration</string>
            <key>PayloadUUID</key><string>{profile_uuid}</string>
            <key>PayloadVersion</key><integer>1</integer>
          </dict>
          </plist>
          '''
          Path('pages/BALI.mobileconfig').write_text(mobileconfig, encoding='utf-8')
          PY

      - name: Add install page
        run: |
          cat > pages/mobile/install.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0a"><title>Установить BALI</title><style>html,body{margin:0;min-height:100%;background:#080a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:28px;border:1px solid #7e613855;border-radius:26px;background:linear-gradient(145deg,#17120d,#0b0a08);box-shadow:0 28px 90px #000a}.mark{width:76px;height:76px;display:grid;place-items:center;border-radius:24px;overflow:hidden;background:#111;margin-bottom:18px}.mark img{width:100%;height:100%;object-fit:cover}h1{margin:0 0 10px;font-size:30px}p{color:#aaa19a;line-height:1.5}.btn{display:grid;place-items:center;min-height:52px;margin-top:20px;border-radius:14px;background:#d6a44e;color:#120d06;text-decoration:none;font-weight:900}.small{font-size:12px}</style></head><body><main><section class="card"><div class="mark"><img src="./BALI-WebClip.png" alt="BALI"></div><h1>Установить BALI</h1><p>Профиль добавит BALI на главный экран iPhone и будет открывать приложение в полноэкранном режиме.</p><a class="btn" href="../BALI.mobileconfig">Скачать MobileConfig</a><p class="small">После скачивания: Настройки → Профиль загружен → Установить.</p></section></main></body></html>
          HTML

      - name: Commit GitHub Pages mobile package
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile BALI.mobileconfig
          if ! git diff --cached --quiet; then
            git commit -m "Publish BALI MobileConfig package"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          fi
