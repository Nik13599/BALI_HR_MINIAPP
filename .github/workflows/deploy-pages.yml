name: Deploy BALI Browser Demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "index.html"
      - "404.html"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout browser demo
        uses: actions/checkout@v4

      - name: Validate browser demo files
        run: |
          test -f index.html
          test -f 404.html
          test -f site/index.html
          test -f site/browser-demo.html
          test -f site/admin.html
          test -f site/browser-admin.html
          test -f site/bali-browser-demo-data.js
          test -f site/store.js
          ! grep -q "telegram-web-app.js" site/index.html
          ! grep -q "supabase-js" site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload browser demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy browser demo
        id: deployment
        uses: actions/deploy-pages@v4
