name: Publish BETA4 production admin
on:
  push:
    branches: [agent/supabase-edge-mobile-api]
    paths:
      - ".github/workflows/publish-beta4-admin-temp.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-edge-mobile-api
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish production admin shell and bridge
        run: |
          cp source/site/admin-production.html pages/site/admin-production.html
          cp source/site/admin-beta4-production-sync.js pages/site/admin-beta4-production-sync.js
          test -f pages/site/admin-api.js
          grep -q 'admin-beta4-production-sync.js' pages/site/admin-production.html
          grep -q 'admin-match3-game-beta4.js' pages/site/admin-production.html
      - name: Commit GitHub Pages
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/admin-production.html site/admin-beta4-production-sync.js
          if git diff --cached --quiet; then
            echo "No Pages changes"
          else
            git commit -m "Publish BETA4 production admin"
            git push origin gh-pages
          fi
