name: Patch Pages validator temporarily

on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/patch-pages-validator-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Expose Node-only Match3 bootstrap failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/match3-game-core-beta4.js')
          text = p.read_text()
          old = 'if (typeof window !== "undefined" && !window.BaliMatch3InfiniteEngine && typeof require === "function") {\n  try { require("./match3-infinite-engine-beta4.js"); } catch {}\n}'
          new = 'if (typeof window !== "undefined" && !window.BaliMatch3InfiniteEngine && typeof require === "function") {\n  try { require("./match3-infinite-engine-beta4.js"); } catch (error) {\n    if (typeof process !== "undefined" && process.versions?.node) console.error("BALI Match3 bootstrap failed", error?.stack || error);\n  }\n}'
          if old not in text and new not in text:
              raise SystemExit('Match3 bootstrap block not found')
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit diagnostic bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/match3-game-core-beta4.js
          if ! git diff --cached --quiet; then
            git commit -m "Expose Match3 Node bootstrap failure"
            git push origin HEAD:gh-pages
          fi
