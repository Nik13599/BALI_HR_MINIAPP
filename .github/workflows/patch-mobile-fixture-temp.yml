name: Patch mobile auth fixture temporarily

on:
  push:
    branches: [agent/supabase-edge-mobile-api]
    paths:
      - ".github/workflows/patch-mobile-fixture-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-edge-mobile-api
      - name: Add migration 018 mobile_credentials fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/server/helpers.ts')
          text = p.read_text()
          marker = "create table public.clans ("
          block = '''create table public.mobile_credentials (
  app_user_key text primary key references public.app_users(user_key) on delete cascade,
  phone text not null unique,
  telegram_username text not null,
  password_hash text not null,
  must_change_password boolean not null default true,
  password_issued_at timestamptz not null default now(),
  password_changed_at timestamptz,
  last_login_at timestamptz,
  failed_login_count integer not null default 0,
  locked_until timestamptz,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

'''
          if 'create table public.mobile_credentials (' not in text:
              if marker not in text:
                  raise SystemExit('clans fixture marker not found')
              p.write_text(text.replace(marker, block + marker, 1))
          PY
      - name: Commit fixture sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/server/helpers.ts
          if ! git diff --cached --quiet; then
            git commit -m "Add mobile credential table to auth fixture"
            git push origin HEAD:agent/supabase-edge-mobile-api
          fi
